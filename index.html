<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="DAMS CONCOURS — Préparez les concours directs de la Fonction publique du Burkina Faso. Gratuit, sans publicité, fonctionne hors connexion." />
    <meta name="theme-color" content="#081426" />
    <title>DAMS CONCOURS — Concours de la Fonction publique du Burkina Faso</title>
    <script>
      // Applique le thème avant le premier rendu pour éviter le flash.
      (function () {
        try {
          var t = localStorage.getItem('dams-theme');
          var dark = t ? t === 'dark' : true;
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
