name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: TypeScript + Build de production
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Cache npm actif dès l'existence du projet (PROMPT 02)
          cache: ${{ hashFiles('package.json') != '' && 'npm' || '' }}

      # Tant que le projet n'a pas encore de package.json (phase de planification),
      # la CI ne fait qu'attester du push. À partir du PROMPT 02, ces étapes
      # s'exécutent automatiquement à chaque push.
      - name: Installer les dépendances
        if: hashFiles('package.json') != ''
        run: npm install

      - name: Vérification TypeScript
        if: hashFiles('package.json') != ''
        run: npm run typecheck --if-present

      - name: Build de production
        if: hashFiles('package.json') != ''
        run: npm run build
